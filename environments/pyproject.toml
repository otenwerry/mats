[project]
name = "mats-environments"
version = "0.1.0"
description = "Real sandbox evaluations for the MATS alignment-drift project"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.11.0",
    "anthropic>=0.76.0",
    # Inspect 0.3.239 currently pins aioboto3/aiobotocore to this boto3 line.
    # Keep the AWS controller in the same standalone environment rather than
    # silently borrowing the repository-root runtime.
    "boto3==1.40.61",
    "inspect-ai==0.3.239",
    "inspect-scout==0.4.39",
    "libcst==1.8.6",
    "matplotlib>=3.11.0",
    "numpy>=2.3.0",
    "openai>=2.14.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
